# Local development stack: gateway + stub, no GPU required.
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# This is the loop PRD §4.7 describes: an M-series MacBook has no CUDA and
# Docker Desktop on macOS has no GPU passthrough, so vLLM cannot run here at
# all. The stub stands in for it, and gateway development is fully unblocked.
services:
  stub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
      # The `dev` target is the runtime image plus stub/. The stub is not in the
      # installed package and not in the production image on purpose: it is an
      # OpenAI-compatible server with no authentication at all.
      target: dev
    # Not published to the host at all. The gateway reaches it by service name
    # on the compose network; nothing else has any business talking to it, which
    # is exactly the relationship vLLM and the gateway have in production.
    expose:
      - "8001"

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
      # Explicit, even though `default` now aliases it: a service that must not
      # be the stub should say which image it wants rather than rely on stage
      # ordering in another file.
      target: runtime
    ports:
      # Loopback only. Same reasoning as the AI service: publishing on all
      # interfaces puts a dev-configured auth surface on the network.
      - "127.0.0.1:8080:8080"
    environment:
      UPSTREAM_URLS: http://stub:8001/v1
      ALLOWED_MODELS: Qwen/Qwen3-8B-AWQ
      API_KEY_STORE_PATH: /app/keys.json
      # Throwaway. A real pepper is injected by the platform and never committed.
      API_KEY_PEPPER: local-dev-pepper-not-a-secret
      AUDIT_LOG_PATH: /app/logs/audit.jsonl
    volumes:
      # PREREQUISITE: run `bash scripts/dev_key.sh` first.
      #
      # A read-only bind of a file that does not exist does not fail
      # helpfully -- Docker creates a DIRECTORY at that path, and the gateway
      # then tries to read a directory as JSON and comes up unable to
      # authenticate anybody. The store is generated rather than committed
      # because it is a per-environment credential registry, which is why
      # `keys.json` is gitignored in the first place.
      #
      # The pepper below must match the one dev_key.sh minted with, or every
      # key in the store fails to verify.
      - ./local-keys.json:/app/keys.json:ro
    depends_on:
      - stub
